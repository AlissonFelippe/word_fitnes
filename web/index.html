<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Academia World Fitness - Transforme seu corpo e sua mente.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="World Fitness">
  <link rel="apple-touch-icon" href="favicon.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>World Fitness | Academia</title>
  <link rel="manifest" href="manifest.json">

  <!-- Fonte da animação -->
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">

  <style>
    /* Tela de sobreposição (Splash/Overlay) aguardando o primeiro frame do Flutter */
    .splash-overlay {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        font-family: 'Montserrat', sans-serif;
        backdrop-filter: blur(22px);
        -webkit-backdrop-filter: blur(22px);
        background: rgba(9, 11, 20, 0.35);
    }

    /* Disparado via JS apenas quando flutter-first-frame ocorrer + tempo mínimo */
    .splash-overlay.fade-out {
        animation: seqOverlayFade 1.4s ease-in-out forwards;
    }

    @keyframes seqOverlayFade {
        0% {
            opacity: 1;
            backdrop-filter: blur(22px);
            -webkit-backdrop-filter: blur(22px);
            background: rgba(9, 11, 20, 0.35);
            visibility: visible;
        }
        99% {
            opacity: 0;
            backdrop-filter: blur(0px);
            -webkit-backdrop-filter: blur(0px);
            background: rgba(9, 11, 20, 0);
            visibility: visible;
        }
        100% {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }
    }

    /* Container principal da logo */
    .logo-stage {
        position: relative;
        width: min(88vw, 560px);
        height: min(88vw, 560px);
        z-index: 10;
        display: flex;
        align-items: center;
        justify-content: center;
        filter: drop-shadow(0 25px 45px rgba(0, 0, 0, 0.75));
        transition: transform 1.2s cubic-bezier(0.22, 1, 0.36, 1), opacity 1.1s ease-in-out;
    }

    /* Recolhe suavemente a logo junto com o fade-out do overlay */
    .splash-overlay.fade-out .logo-stage {
        transform: scale(0.72);
        opacity: 0;
    }

    .logo-stage svg {
        width: 100%;
        height: 100%;
        overflow: visible;
    }

    /* =====================================================================
       ANIMAÇÃO DE ENTRADA (1.8s) + PERMANÊNCIA ATÉ O FLUTTER CARREGAR
       ===================================================================== */

    /* 1. Círculo externo translúcido */
    .outer-glass-ring {
        transform-origin: 300px 300px;
        opacity: 0;
        animation: enterOuterRing 1.2s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    @keyframes enterOuterRing {
        0% { opacity: 0; transform: scale(0.35) rotate(-55deg); }
        100% { opacity: 1; transform: scale(1) rotate(0deg); }
    }

    /* 2. Anel oval principal (Vermelho & Azul) */
    .main-oval-group {
        transform-origin: 300px 300px;
        opacity: 0;
        animation: enterMainOval 1.1s cubic-bezier(0.34, 1.35, 0.64, 1) 0.2s forwards;
    }

    @keyframes enterMainOval {
        0% { opacity: 0; transform: scale(0.15); }
        100% { opacity: 1; transform: scale(1); }
    }

    /* 3. Globo central e linhas de grade */
    .globe-core {
        transform-origin: 300px 300px;
        opacity: 0;
        animation: enterGlobeCore 1.0s cubic-bezier(0.22, 1, 0.36, 1) 0.4s forwards;
    }

    @keyframes enterGlobeCore {
        0% { opacity: 0; transform: scale(0); }
        100% { opacity: 1; transform: scale(1); }
    }

    .globe-grid-line {
        stroke-dasharray: 600;
        stroke-dashoffset: 600;
        animation: drawGrid 1.1s ease-in-out 0.55s forwards;
    }

    @keyframes drawGrid {
        0% { stroke-dashoffset: 600; opacity: 0; }
        100% { stroke-dashoffset: 0; opacity: 0.9; }
    }

    /* 4. Atletas estilizados */
    .athlete-left {
        transform-origin: 245px 300px;
        opacity: 0;
        animation: enterAthleteLeft 0.9s cubic-bezier(0.34, 1.3, 0.64, 1) 0.75s forwards;
    }

    @keyframes enterAthleteLeft {
        0% { opacity: 0; transform: translateX(-55px) scale(0.5); }
        100% { opacity: 1; transform: translateX(0) scale(1); }
    }

    .athlete-right {
        transform-origin: 355px 300px;
        opacity: 0;
        animation: enterAthleteRight 0.9s cubic-bezier(0.34, 1.3, 0.64, 1) 0.85s forwards;
    }

    @keyframes enterAthleteRight {
        0% { opacity: 0; transform: translateX(55px) scale(0.5); }
        100% { opacity: 1; transform: translateX(0) scale(1); }
    }

    /* 5. Textos WORLD & FITNESS */
    .brand-text-top {
        transform-origin: 300px 130px;
        opacity: 0;
        animation: enterTextTop 0.8s cubic-bezier(0.22, 1, 0.36, 1) 0.95s forwards;
    }

    @keyframes enterTextTop {
        0% { opacity: 0; transform: translateY(-28px) scale(0.8); }
        100% { opacity: 1; transform: translateY(0) scale(1); }
    }

    .brand-text-bottom {
        transform-origin: 300px 475px;
        opacity: 0;
        animation: enterTextBottom 0.8s cubic-bezier(0.22, 1, 0.36, 1) 1.05s forwards;
    }

    @keyframes enterTextBottom {
        0% { opacity: 0; transform: translateY(28px) scale(0.8); }
        100% { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* 6. Estrelas laterais */
    .star-item {
        transform-box: fill-box;
        transform-origin: center;
        opacity: 0;
        animation: enterStarPop 0.7s cubic-bezier(0.34, 1.4, 0.64, 1) 1.15s forwards;
    }

    @keyframes enterStarPop {
        0% { opacity: 0; transform: scale(0) rotate(-90deg); }
        100% { opacity: 1; transform: scale(1) rotate(0deg); }
    }

    /* 7. Reflexo metálico (Sheen) contínuo enquanto aguarda */
    .sheen-sweep {
        opacity: 0;
        animation: loopSheenPass 2.6s ease-in-out 1.6s infinite;
    }

    @keyframes loopSheenPass {
        0% { transform: translateX(-650px) skewX(-25deg); opacity: 0; }
        15% { opacity: 0.7; }
        55% { transform: translateX(650px) skewX(-25deg); opacity: 0.7; }
        70%, 100% { transform: translateX(650px) skewX(-25deg); opacity: 0; }
    }

    /* 8. Brilhos nas bordas (Lens Flares) */
    .lens-flare {
        transform-box: fill-box;
        transform-origin: center;
        opacity: 0;
        animation: pulseFlare 2.2s ease-in-out 1.5s infinite alternate;
    }

    @keyframes pulseFlare {
        0% { opacity: 0.4; transform: scale(0.75); }
        100% { opacity: 1; transform: scale(1.15); }
    }

    /* 9. Flutuação suave contínua */
    .idle-float {
        transform-origin: 300px 300px;
        animation: loopFloat 2.8s ease-in-out 1.7s infinite alternate;
    }

    @keyframes loopFloat {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-7px); }
    }
  </style>
</head>
<body style="background-color: #0B0F19;">

  <!-- SCRIPT DE SINCRONIZAÇÃO COM O PRIMEIRO FRAME DO FLUTTER -->
  <script>
    const splashOverlay = document.getElementById('splashOverlay');

    let flutterReady = false;
    let minTimePassed = false;
    let closingStarted = false;

    function tryCloseSplash() {
      if (flutterReady && minTimePassed && !closingStarted) {
        closingStarted = true;
        splashOverlay.classList.add('fade-out');
      }
    }

    // Atrasa o início do motor do Flutter em 1.4s para a entrada da logo rodar lisa
    setTimeout(() => {
      const script = document.createElement('script');
      script.src = 'flutter_bootstrap.js';
      script.async = true;
      document.body.appendChild(script);
    }, 1400);

    // 1. Ouve o evento oficial do Flutter quando a primeira tela real aparece por baixo
    window.addEventListener('flutter-first-frame', () => {
      flutterReady = true;
      tryCloseSplash();
    });

    // 2. Garante pelo menos 3.8s para a logo abrir e ser exibida por 2 segundos completos
    setTimeout(() => {
      minTimePassed = true;
      tryCloseSplash();
    }, 3800);

    // 3. Fallback de segurança (caso o evento falhe em algum navegador antigo, fecha após 8s)
    setTimeout(() => {
      if (!closingStarted) {
        flutterReady = true;
        minTimePassed = true;
        tryCloseSplash();
      }
    }, 8000);

    // 4. Remove o overlay da DOM após o fade-out para liberar os cliques na página
    splashOverlay.addEventListener('animationend', (e) => {
      if (e.animationName === 'seqOverlayFade') {
        splashOverlay.remove();
      }
    });
  </script>
</body>
